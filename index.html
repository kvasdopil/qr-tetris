<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <input id="url" type="text" value="sillygoose.se" placeholder="sillygoose.se" autocomplete="off" spellcheck="false" />
      <svg id="qr" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" hidden>
        <path id="qr-path" fill="#000" fill-rule="evenodd" />
      </svg>
      <p id="error"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
